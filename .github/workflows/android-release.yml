name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Label versi APK artifact (contoh: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate Release Keystore Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64, STORE_PASSWORD, atau KEY_PASSWORD belum diisi di GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "${{ github.workspace }}/my-upload-key.jks"

      - name: Run Unit Tests & Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Cleanup Keystore from Runner
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Prepare Versioned Release APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.release_version }}"
          fi
          mkdir -p build-release
          cp app/build/outputs/apk/release/app-release.apk "build-release/win11-launcher-${TAG}.apk"
          ls -lh build-release/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win11-launcher-release-apk
          path: build-release/win11-launcher-*.apk

      - name: Publish GitHub Release with APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-release/win11-launcher-*.apk
          generate_release_notes: true
